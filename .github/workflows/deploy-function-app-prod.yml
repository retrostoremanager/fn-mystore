name: Deploy Function App (prod)

# Manual-only on purpose: prod should never deploy as a side effect of a dev push.
# Code-only deploy -- doesn't touch DB migrations or app settings, both of which are
# handled separately for prod (app settings are provisioned/updated by hand or via a
# dedicated one-off workflow, not bundled into every code deploy here).
#
# mystore-func-prod runs on Flex Consumption (Linux) as of 2026-11-24, after Windows
# Consumption's host runtime proved unable to reliably specialize .NET 9/10
# isolated-worker apps on this subscription's scale unit. Flex Consumption uses a
# different deployment model than classic zip-deploy: az functionapp deployment
# source config-zip and even az functionapp deploy / Azure/functions-action were all
# confirmed to silently no-op against it (the function list stayed stuck on the
# system WarmUp placeholder). Azure Functions Core Tools (func azure functionapp
# publish) is the only method confirmed to actually work here.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/ref to deploy'
        required: false
        default: 'main'

concurrency:
  group: deploy-function-app-prod
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || 'main' }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install Azure Functions Core Tools
      run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

    - name: Restore dependencies (linux-x64)
      run: dotnet restore MyStore.sln --runtime linux-x64

    - name: Build
      run: dotnet build MyStore.sln --configuration Release --no-restore

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Publish with Azure Functions Core Tools
      working-directory: MyStore.Functions
      run: func azure functionapp publish mystore-func-prod --dotnet-isolated

    - name: Deployment Complete
      run: |
        echo "fn-mystore deployed to prod successfully!"
        echo "URL: https://mystore-func-prod.azurewebsites.net"
