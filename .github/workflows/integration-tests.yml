name: DB Integration Tests

# The [IntegrationFact] repository tests (MyStore.Tests/Repositories/*) have always documented
# that they "run only in the integration-tests workflow, which exports RUN_DB_INTEGRATION_TESTS
# and MYSTORE_TEST_DB" -- but that workflow never existed until now, so they were silently
# skipped in every run, forever. This is that workflow.

on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mystore_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout fn-mystore
        uses: actions/checkout@v4

      - name: Checkout dbproj-mystore migrations
        uses: actions/checkout@v4
        with:
          repository: retrostoremanager/dbproj-mystore
          ref: development
          token: ${{ secrets.GH_DISPATCH_TOKEN }}
          path: dbproj-mystore

      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d mystore_db -v ON_ERROR_STOP=1 -f dbproj-mystore/PostgreSQL/000_deploy_all.sql

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MyStore.sln

      - name: Build
        run: dotnet build MyStore.sln --configuration Release --no-restore

      - name: Run DB integration tests
        env:
          RUN_DB_INTEGRATION_TESTS: '1'
          MYSTORE_TEST_DB: "Host=localhost;Port=5432;Database=mystore_db;Username=postgres;Password=postgres"
        run: dotnet test MyStore.Tests/MyStore.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
